services:
  db:
    image: postgres:16-alpine
    container_name: lenny-growth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenny_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny_dev_password_change_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-lenny_growth_db}
    ports:
      # Host port 5433 mapped to container port 5432 to avoid collision with any existing host Postgres
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenny_user} -d ${POSTGRES_DB:-lenny_growth_db}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lenny-growth-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lenny_user}:${POSTGRES_PASSWORD:-lenny_dev_password_change_in_prod}@db:5432/${POSTGRES_DB:-lenny_growth_db}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}  # not OLLAMA_BASE_URL: .env holds the host-side localhost value
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      RETRIEVER_LIMIT: ${RETRIEVER_LIMIT:-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      MIN_TERM_COVERAGE: ${MIN_TERM_COVERAGE:-0.65}
      ESSAY_MAX_ATTEMPTS: ${ESSAY_MAX_ATTEMPTS:-0}
      AUTO_INGEST: "true"
      LOG_FORMAT: ${LOG_FORMAT:-json}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lenny-growth-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
